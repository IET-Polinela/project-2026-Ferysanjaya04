name: Deploy Frontend SPA to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site for Pages
        run: |
          mkdir -p _site
          rsync -av --exclude node_modules --exclude playwright --exclude test-results --exclude .git --exclude .github smartcity_citizen_spa_23758041/ _site/

      - name: Upload frontend files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Issue Reporting - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1A237E 0%, #3F51B5 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1A237E 0%, #3F51B5 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #1A237E 0%, #3F51B5 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #1A237E;
            color: white;
        }
        
        .btn-primary:hover {
            background: #3F51B5;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #FF9800;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #F57C00;
        }
        
        .reports-section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #FF9800;
            padding-bottom: 10px;
        }
        
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .report-card {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
            border-left: 5px solid #1A237E;
        }
        
        .report-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        
        .report-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .report-card .category {
            display: inline-block;
            background: #1A237E;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        
        .report-card .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .report-card .location {
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }
        
        .report-card .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .status.REPORTED {
            background: #cce5ff;
            color: #004085;
        }
        
        .status.IN_PROGRESS {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.RESOLVED {
            background: #d4edda;
            color: #155724;
        }
        
        .status.REJECTED {
            background: #f8d7da;
            color: #721c24;
        }
        
        .report-card .date {
            color: #999;
            font-size: 12px;
            margin-bottom: 15px;
        }
        
        .report-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-view {
            background: #1A237E;
            color: white;
        }
        
        .btn-view:hover {
            background: #3F51B5;
        }
        
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 15px;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #FF9800;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .nav-links a:hover {
            color: #F57C00;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏙️ Smart City Issue Reporting</h1>
            <p>Sistem Pelaporan Masalah Kota</p>
        </div>
        
        <div class="content">
            <div class="nav-links">
                <a href="/">🏠 Home</a>
                <a href="/reports/">📋 Daftar Laporan</a>
                <a href="/users/">👥 Daftar User</a>
                <a href="/about/">ℹ️ About</a>
                <a href="/contacts/">📞 Contacts</a>
            </div>
            
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Laporan</h3>
                    <div class="number">{{ total_reports }}</div>
                </div>
            </div>
            
            <div class="button-group">
                <a href="/reports/add/" class="btn btn-primary">+ Buat Laporan Baru</a>
                <a href="/reports/" class="btn btn-secondary">Lihat Semua Laporan</a>
            </div>
        </div>
    </div>
</body>
</html>

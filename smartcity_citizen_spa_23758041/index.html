<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Warga - Smart City Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { 
            background-color: #f4f6f9; 
        }
        .modal:not(.show) {
            display: none;
        }
        .spa-container { 
            min-height: calc(100vh - 80px); 
        }
        /* Custom estetika warna biru sesuai preferensi proyek Mas Fery */
        .bg-primary, .btn-primary {
            background-color: #0056b3 !important;
            border-color: #0056b3 !important;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-buildings-fill me-2"></i>Smart City Portal
            </a>
            <div id="nav-menus" class="ms-auto"></div>
        </div>
    </nav>

    <main class="container-fluid px-4 mt-4 spa-container" id="app-content"></main>

    <!-- ================================================================
         LAB 12: Modal Bootstrap untuk Create/Edit Laporan
         ================================================================ -->
    <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="reportModalLabel">
                        <i class="bi bi-pencil-square me-2"></i>✏️ Buat Laporan Baru
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="reportForm">
                        <!-- Field 1: Judul Laporan -->
                        <div class="mb-3">
                            <label for="inputTitle" class="form-label fw-bold">Judul Laporan</label>
                            <input type="text" class="form-control" id="inputTitle" placeholder="Deskripsi singkat masalah" required>
                        </div>

                        <!-- Field 2: Kategori -->
                        <div class="mb-3">
                            <label for="inputCategory" class="form-label fw-bold">Kategori</label>
                            <select class="form-select" id="inputCategory" required>
                                <option value="">-- Pilih Kategori --</option>
                                <option value="Infrastruktur">Infrastruktur</option>
                                <option value="Fasilitas Umum">Fasilitas Umum</option>
                                <option value="Kebersihan">Kebersihan</option>
                                <option value="Keamanan">Keamanan</option>
                                <option value="JALAN">Jalan Rusak</option>
                                <option value="LAMPU">Lampu Jalan</option>
                                <option value="AIR">Pipa Air</option>
                                <option value="SAMPAH">Penumpukan Sampah</option>
                                <option value="LAINNYA">Lainnya</option>
                            </select>
                        </div>

                        <!-- Field 3: Deskripsi Lengkap -->
                        <div class="mb-3">
                            <label for="inputDescription" class="form-label fw-bold">Deskripsi Lengkap</label>
                            <textarea class="form-control" id="inputDescription" rows="3" placeholder="Jelaskan detail masalah dengan lengkap..." required></textarea>
                        </div>

                        <!-- Field 4: Lokasi -->
                        <div class="mb-3">
                            <label for="inputLocation" class="form-label fw-bold">Lokasi</label>
                            <input type="text" class="form-control" id="inputLocation" placeholder="Alamat atau nama jalan" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top bg-light">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Tutup</button>
                    <button type="button" class="btn btn-secondary fw-bold p-4" id="btnDraft">
                        <i class="bi bi-send-fill me-1"></i>Simpan Draft
                    </button>
                    <button type="button" class="btn btn-primary fw-bold p-4" id="btnSubmit">
                        <i class="bi bi-send-fill me-1"></i>Ajukan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js?v=20260614-2315"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js?v=20260614-2325"></script>
    <script src="js/router.js"></script>
</body>
</html>

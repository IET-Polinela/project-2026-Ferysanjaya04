<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart City Issue Reporting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1A237E 0%, #3F51B5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .sticker {
            position: fixed;
            width: 120px;
            height: 120px;
            font-size: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.2));
            animation: float 4s ease-in-out infinite;
            z-index: 1;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0px) rotate(-5deg);
            }
            50% {
                transform: translateY(-30px) rotate(5deg);
            }
            100% {
                transform: translateY(0px) rotate(-5deg);
            }
        }
        
        .sticker-left {
            left: 20px;
            top: 50px;
            animation-delay: 0s;
        }
        
        .sticker-right {
            right: 20px;
            bottom: 100px;
            animation-delay: 1.5s;
        }
        
        .container {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(26, 35, 126, 0.4);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }
        
        .header {
            background: linear-gradient(135deg, #1A237E 0%, #3F51B5 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #FF9800;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.3);
        }
        
        .messages {
            margin-bottom: 20px;
        }
        
        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #1A237E 0%, #3F51B5 100%);
            color: white;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(26, 35, 126, 0.4);
        }
        
        .link-section {
            margin-top: 30px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .link-section p {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .link-section a {
            color: #FF9800;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .link-section a:hover {
            color: #F57C00;
        }
        
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #FF9800;
            font-size: 20px;
            user-select: none;
            background: none;
            border: none;
            padding: 5px 10px;
        }
        
        .toggle-password:hover {
            color: #F57C00;
        }
    </style>
</head>
<body>
    <div class="sticker sticker-left">😴</div>
    <div class="sticker sticker-right">💤</div>
    
    <div class="container">
        <div class="header">
            <h1>🔐 Login</h1>
            <p>Masuk ke Smart City Issue Reporting</p>
        </div>
        
        <div class="content">
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
            
            <form method="POST">
                {% csrf_token %}
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                
                <div class="form-group">
                    <label for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
                    {{ form.username }}
                </div>
                
                <div class="form-group">
                    <label for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="passwordInput" class="form-control" required>
                        <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                    </div>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-submit">Login</button>
                </div>
            </form>
            
            <div class="link-section">
                <p>Belum punya akun?</p>
                <a href="{% url 'register' %}">Daftar sekarang →</a>
            </div>
        </div>
    </div>
    
    <script>
        const passwordInput = document.getElementById('passwordInput');
        const togglePassword = document.getElementById('togglePassword');
        
        togglePassword.addEventListener('click', function(e) {
            e.preventDefault();
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                togglePassword.textContent = '👁️';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- TITLE DINAMIS -->
    <title>{% block title %}IET City{% endblock %}</title>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
        .container { max-width: 1140px; margin: 0 auto; padding: 0 16px; }
        .navbar { background: #0d6efd; color: #fff; padding: 12px 0; }
        .navbar .container, .navbar-nav { display: flex; align-items: center; gap: 16px; }
        .navbar-brand, .nav-link { color: #fff; text-decoration: none; }
        .navbar-brand { font-weight: 700; }
        .navbar-collapse { margin-left: auto; }
        .navbar-nav { list-style: none; margin: 0; padding: 0; }
        .mt-3 { margin-top: 1rem; } .mt-4 { margin-top: 1.5rem; } .mt-5 { margin-top: 3rem; }
        .mb-3 { margin-bottom: 1rem; }
        .d-inline { display: inline; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 4px; }
        .form-label { display: block; margin-bottom: 6px; }
        .fw-bold { font-weight: 700; }
        .table { width: 100%; border-collapse: collapse; background: #fff; }
        .table th, .table td { border: 1px solid #dee2e6; padding: 8px; }
        .table-primary { background: #cfe2ff; }
        .table-responsive { overflow-x: auto; }
        .btn { display: inline-block; padding: 6px 10px; border-radius: 4px; border: 1px solid transparent; text-decoration: none; cursor: pointer; }
        .btn-sm { padding: 4px 8px; font-size: 0.875rem; }
        .btn-primary { background: #0d6efd; color: #fff; }
        .btn-info { background: #0dcaf0; color: #000; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-success { background: #198754; color: #fff; }
        .btn-warning { background: #ffc107; color: #000; }
        .btn-danger { background: #dc3545; color: #fff; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; color: #fff; }
        .bg-info { background: #0dcaf0; color: #000; }
        .bg-secondary { background: #6c757d; }
        .bg-primary { background: #0d6efd; }
        .bg-warning { background: #ffc107; color: #000; }
        .bg-success { background: #198754; }
        .text-center { text-align: center; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">IET City</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/reports/">Reports</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about/">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/contacts/">Contact</a>
                </li>

                {% if user.is_staff or user.is_admin %}
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard/" style="color: #FFD700;">📊 Dashboard</a>
                </li>
                {% endif %}

            </ul>
        </div>
    </div>
</nav>

<!-- ALERT MESSAGES (DINAMIS SESUAI JENIS) -->
<div class="container mt-3">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
</div>

<!-- MAIN CONTENT -->
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<!-- FOOTER (OPSIONAL BIAR LEBIH RAPI) -->
<footer class="bg-light text-center mt-5 p-3">
    <small>© 2026 IET City - Lab Session 5</small>
</footer>

</body>
</html>

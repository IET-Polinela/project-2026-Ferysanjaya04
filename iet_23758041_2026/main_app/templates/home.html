<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Issue Reporting - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1A237E 0%, #3F51B5 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(26, 35, 126, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1A237E 0%, #3F51B5 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
            display: flex;
            gap: 30px;
        }
        
        .main-area {
            flex: 1;
            min-width: 0;
        }
        
        .sidebar {
            width: 180px;
            background: linear-gradient(135deg, #1A237E, #3F51B5);
            border: 2px solid #1A237E;
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(26, 35, 126, 0.2);
        }
        
        .sidebar a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .sidebar a:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.4);
            border-color: white;
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.4);
        }
        
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                flex-direction: row;
            }
            
            .sidebar a {
                flex: 1;
            }
        }
        
        .user-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .user-info p {
            color: #333;
            margin: 5px 0;
        }
        
        .logout-btn {
            background: #FF9800;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .logout-btn:hover {
            background: #F57C00;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #1A237E 0%, #3F51B5 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
            color: white;
        }
        
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: white;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #1A237E, #3F51B5) !important;
            color: white !important;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #3F51B5, #1A237E) !important;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: rgba(255, 152, 0, 0.2) !important;
            color: #FF9800 !important;
            border: 2px solid #FF9800 !important;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 152, 0, 0.3) !important;
            box-shadow: 0 8px 20px rgba(255, 152, 0, 0.3) !important;
        }
        
        .report-card {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
            border-left: 5px solid #1A237E;
        }
        
        .report-card:hover {
            box-shadow: 0 5px 15px rgba(26, 35, 126, 0.2);
            transform: translateY(-2px);
        }
        
        .report-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .report-card .category {
            display: inline-block;
            background: linear-gradient(135deg, #1A237E, #3F51B5);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        
        .report-card .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .report-card .location {
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }
        
        .report-card .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .status.REPORTED {
            background: #cce5ff;
            color: #004085;
        }
        
        .status.IN_PROGRESS {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.RESOLVED {
            background: #d4edda;
            color: #155724;
        }
        
        .status.REJECTED {
            background: #f8d7da;
            color: #721c24;
        }
        
        .report-card .date {
            color: #999;
            font-size: 12px;
            margin-bottom: 15px;
        }
        
        .report-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-small {
            padding: 8px 15px;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-view {
            background: linear-gradient(135deg, #1A237E, #3F51B5);
            color: white;
        }
        
        .btn-view:hover {
            background: linear-gradient(135deg, #3F51B5, #1A237E);
        }
        
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #FF9800;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .nav-links a:hover {
            color: #F57C00;
        }
        
        .reports-section {
            margin-top: 40px;
        }
        
        .reports-section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #FF9800;
            padding-bottom: 10px;
        }
        
        .reports-grid {
            display: grid;
            gap: 20px;
        }
        
        .btn-edit {
            background: #28a745;
            color: white;
        }
        
        .btn-edit:hover {
            background: #218838;
        }
        
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        
        .btn-delete:hover {
            background: #c82333;
        }
        
        .bottom-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .bottom-buttons a {
            background: linear-gradient(135deg, #1A237E, #3F51B5);
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .bottom-buttons a:hover {
            background: linear-gradient(135deg, #3F51B5, #1A237E);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>
                    <h1>🏙️ Smart City Issue Reporting</h1>
                    <p>Sistem Pelaporan Masalah Kota</p>
                </div>
                <div style="text-align: right; color: white;">
                    <p style="margin-bottom: 5px;">👤 {{ user.username }}</p>
                    <a href="{% url 'logout' %}" style="color: white; text-decoration: none; font-weight: 600; background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 5px; display: inline-block;">Logout</a>
                </div>
            </div>
        </div>
        
        <div class="content">
            <div class="main-area">
                <div class="nav-links">
                    <a href="/">🏠 Home</a>
                    <a href="/reports/">📋 Daftar Laporan</a>
                </div>
                
                <div class="stats">
                    <div class="stat-card">
                        <h3>Total Laporan</h3>
                        <div class="number">{{ total_reports }}</div>
                    </div>
                </div>
                
                <div class="button-group">
                    <a href="/reports/add/" class="btn btn-primary">+ Buat Laporan Baru</a>
                    <a href="/reports/" class="btn btn-secondary">Lihat Semua Laporan</a>
                </div>
            </div>
            
            <div class="sidebar">
                <a href="/about/">ℹ️ About</a>
                <a href="/contacts/">📞 Contacts</a>
            </div>
        </div>
    </div>
</body>
</html>

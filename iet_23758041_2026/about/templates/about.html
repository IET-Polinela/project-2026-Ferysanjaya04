<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kota Lampung - About</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; background: rgba(255,255,255,0.95); box-shadow: 0 10px 30px rgba(0,0,0,0.2); border-radius: 15px; text-align: center; position: relative; top: 20px; }
    h1 { font-size: 3em; background: linear-gradient(45deg, #ff6b6b, #4ecdc4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
    nav { margin: 30px 0; }
    nav button { margin: 0 15px; padding: 15px 30px; font-size: 16px; background: linear-gradient(45deg, #007bff, #0056b3); color: white; border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,123,255,0.4); position: relative; overflow: hidden; }
    nav button:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,123,255,0.6); }
    nav button:active { transform: translateY(0); }
    p { font-size: 1.4em; line-height: 1.6; color: #555; margin-top: 30px; }
    .active { background: linear-gradient(45deg, #28a745, #20c997) !important; box-shadow: 0 5px 15px rgba(40,167,69,0.4) !important; }
    @media (max-width: 768px) { h1 { font-size: 2em; } nav button { display: block; margin: 10px auto; width: 200px; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tentang Kami - Kota Lampung</h1>
    <nav>
      <button id="home-btn" onclick="window.location.href='/'">🏠 Home</button>
      <button id="about-btn" onclick="window.location.href='/about/'" class="active">ℹ️ About</button>
      <button id="contacts-btn" onclick="window.location.href='/contacts/'">📞 Contacts</button>
    </nav>
    <p>Ini adalah halaman About. Kota Lampung adalah provinsi di ujung selatan Sumatera dengan keindahan alam dan budaya yang kaya.</p>
  </div>
  <script>
    const path = window.location.pathname;
    document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
    if (path === '/') document.getElementById('home-btn').classList.add('active');
    else if (path === '/about/') document.getElementById('about-btn').classList.add('active');
    else if (path === '/contacts/') document.getElementById('contacts-btn').classList.add('active');
  </script>
</body>
</html>
